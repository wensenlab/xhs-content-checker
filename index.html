                                            <div className="relative w-24 h-24 flex-shrink-0 flex items-center justify-center">
                                                <svg className="w-24 h-24 transform -rotate-90" viewBox="0 0 36 36">
                                                    <path
                                                        className="text-slate-100"
                                                        strokeWidth="3.2"
                                                        stroke="currentColor"
                                                        fill="none"
                                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                                                    />
                                                    <path
                                                        stroke={analysis.risk.ringColor}
                                                        strokeDasharray={`${analysis.healthScore}, 100`}
                                                        strokeWidth="3.2"
                                                        strokeLinecap="round"
                                                        fill="none"
                                                        className="transition-all duration-700 ease-out"
                                                        d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                                                    />
                                                </svg>
                                                <div className="absolute text-center">
                                                    <span className={`text-2xl font-black ${analysis.risk.color}`}>
                                                        {analysis.healthScore}
                                                    </span>
                                                    <span className="block text-[9px] text-slate-400 font-bold uppercase tracking-wider">健康分</span>
                                                </div>
                                            </div>

                                            <div>
                                                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border mb-1.5" style={{ borderColor: 'transparent' }}>
                                                    <span className={`px-2 py-0.5 rounded-full ${analysis.risk.badgeBg}`}>
                                                        {analysis.risk.tag}
                                                    </span>
                                                </div>
                                                <p className="text-xs text-slate-500 leading-relaxed font-normal">
                                                    {analysis.risk.desc}
                                                </p>
                                            </div>
                                        </div>

                                        {/* 中间：关键指标卡片 */}
                                        <div className="md:col-span-5 grid grid-cols-3 gap-2.5 text-center md:px-2 md:border-r border-slate-100">
                                            <div className="p-3 rounded-2xl bg-white/70 border border-slate-100">
                                                <span className="text-[11px] text-slate-400 block mb-0.5">检出敏感词</span>
                                                <span className={`text-lg font-black ${analysis.totalIssues > 0 ? 'text-brand-600' : 'text-emerald-600'}`}>
                                                    {analysis.totalIssues} <span className="text-xs font-normal text-slate-400">处</span>
                                                </span>
                                            </div>
                                            <div className="p-3 rounded-2xl bg-white/70 border border-slate-100">
                                                <span className="text-[11px] text-slate-400 block mb-0.5">高危红线</span>
                                                <span className={`text-lg font-black ${analysis.highRiskCount > 0 ? 'text-rose-600' : 'text-slate-700'}`}>
                                                    {analysis.highRiskCount} <span className="text-xs font-normal text-slate-400">类</span>
                                                </span>
                                            </div>
                                            <div className="p-3 rounded-2xl bg-white/70 border border-slate-100">
                                                <span className="text-[11px] text-slate-400 block mb-0.5">总字数</span>
                                                <span className="text-lg font-black text-slate-800">
                                                    {analysis.charCount} <span className="text-xs font-normal text-slate-400">字</span>
                                                </span>
                                            </div>
                                        </div>

                                        {/* 右侧：动作按钮 */}
                                        <div className="md:col-span-3 flex flex-col gap-2.5">
                                            {analysis.totalIssues > 0 ? (
                                                <button
                                                    onClick={handleApplyAllRewrites}
                                                    className="w-full inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-gradient-to-r from-brand-500 to-rose-600 hover:from-brand-600 hover:to-rose-700 text-white font-semibold text-xs shadow-md shadow-brand-500/20 transition active:scale-[0.98]"
                                                >
                                                    <IconWand size={15} />
                                                    一键全篇应用合规平替
                                                </button>
                                            ) : (
                                                <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-center text-xs text-emerald-800 font-semibold">
                                                    ✨ 文案得体克制，无敏感词！
                                                </div>
                                            )}

                                            <button
                                                onClick={() => setActiveTab('rewrite')}
                                                className="w-full inline-flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs font-semibold transition"
                                            >
                                                <IconSparkles size={14} className="text-brand-500" />
                                                查看全篇合规推荐定稿
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* 拟态分段控制器（清晰实用三栏） */}
                                <div className="p-1.5 bg-slate-200/60 backdrop-blur-md rounded-2xl flex items-center gap-1 text-xs font-bold text-slate-600 shadow-inner">
                                    <button
                                        onClick={() => setActiveTab('audit')}
                                        className={`flex-1 py-2.5 px-3 rounded-xl transition-all flex items-center justify-center gap-1.5 ${
                                            activeTab === 'audit'
                                                ? 'bg-white text-brand-600 shadow-sm'
                                                : 'hover:text-slate-900 hover:bg-white/40'
                                        }`}
                                    >
                                        <IconAlertCircle size={15} />
                                        <span>违禁词排雷与平替 ({analysis.uniqueFound.length})</span>
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('rewrite')}
                                        className={`flex-1 py-2.5 px-3 rounded-xl transition-all flex items-center justify-center gap-1.5 ${
                                            activeTab === 'rewrite'
                                                ? 'bg-white text-brand-600 shadow-sm'
                                                : 'hover:text-slate-900 hover:bg-white/40'
                                        }`}
                                    >
                                        <IconSparkles size={15} />
                                        <span>合规推荐定稿与一键复制</span>
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('content')}
                                        className={`flex-1 py-2.5 px-3 rounded-xl transition-all flex items-center justify-center gap-1.5 ${
                                            activeTab === 'content'
                                                ? 'bg-white text-brand-600 shadow-sm'
                                                : 'hover:text-slate-900 hover:bg-white/40'
                                        }`}
                                    >
                                        <IconLayers size={15} />
                                        <span>爆款排版体检</span>
                                    </button>
                                </div>

                                {/* TAB 1: 违禁词排雷与手术刀平替 */}
                                {activeTab === 'audit' && (
                                    <div className="space-y-6 animate-floatUp">
                                        <div className="glass-panel rounded-3xl p-6 sm:p-8">
                                            <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                                                <div className="flex items-center gap-2">
                                                    <span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
                                                    <h3 className="font-bold text-slate-900 text-sm sm:text-base">
                                                        原文敏感词高亮标注
                                                    </h3>
                                                </div>
                                                <span className="text-xs text-slate-400">点击高亮词可一键替换为平替词</span>
                                            </div>
                                            <div className="p-5 sm:p-6 rounded-2xl bg-white/70 border border-slate-100 font-sans leading-relaxed">
                                                {renderHighlightedText()}
                                            </div>
                                        </div>

                                        {analysis.uniqueFound.length > 0 ? (
                                            <div className="glass-panel rounded-3xl p-6 sm:p-8 space-y-4">
                                                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                                                    <div className="flex items-center gap-2">
                                                        <IconWand size={18} className="text-emerald-600" />
                                                        <h3 className="font-bold text-slate-900 text-sm sm:text-base">
                                                            手术刀式审美平替建议矩阵
                                                        </h3>
                                                    </div>
                                                    <span className="text-xs text-slate-400">点击绿色胶囊直接替换文中文本</span>
                                                </div>

                                                <div className="grid grid-cols-1 gap-3.5">
                                                    {analysis.uniqueFound.map((item, idx) => {
                                                        const rep = REPLACEMENT_DICT[item.word];
                                                        const categoryInfo = BANNED_CATEGORIES[item.category];

                                                        return (
                                                            <div
                                                                key={idx}
                                                                className="p-4 sm:p-5 rounded-2xl bg-white/80 border border-slate-100/90 shadow-sm hover:border-slate-200 transition-all flex flex-col md:flex-row md:items-center justify-between gap-3"
                                                            >
                                                                <div className="space-y-1">
                                                                    <div className="flex items-center gap-2 flex-wrap">
                                                                        <span className="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-700 font-bold text-sm border border-rose-200/60">
                                                                            {item.word}
                                                                        </span>
                                                                        <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">
                                                                            {item.category}
                                                                        </span>
                                                                        <span className={`text-[10px] px-2 py-0.5 rounded-full border ${item.color}`}>
                                                                            {item.badge}
                                                                        </span>
                                                                        <span className="text-xs text-slate-400">
                                                                            出现 {item.count} 次
                                                                        </span>
                                                                    </div>
                                                                    <p className="text-xs text-slate-500 font-normal">
                                                                        {categoryInfo?.desc || '涉及广告法或平台风控限制'}
                                                                    </p>
                                                                </div>

                                                                <div className="flex items-center gap-2 flex-wrap md:justify-end">
                                                                    {rep ? (
                                                                        <>
                                                                            <button
                                                                                onClick={() => handleApplySingleWord(item.word, rep.best)}
                                                                                className="px-3.5 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200/80 text-xs font-semibold flex items-center gap-1.5 shadow-sm transition active:scale-95 group"
                                                                                title="点击将当前词替换为此平替表达"
                                                                            >
                                                                                <span>{rep.best}</span>
                                                                                <span className="text-[10px] px-1.5 py-0.2 rounded bg-emerald-200/60 text-emerald-800">
                                                                                    首选
                                                                                </span>
                                                                            </button>
                                                                            {rep.alts && rep.alts.map((alt, i) => (
                                                                                <button
                                                                                    key={i}
                                                                                    onClick={() => handleApplySingleWord(item.word, alt)}
                                                                                    className="px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 text-xs font-medium transition active:scale-95"
                                                                                    title="点击将当前词替换为此平替表达"
                                                                                >
                                                                                    {alt}
                                                                                </button>
                                                                            ))}
                                                                        </>
                                                                    ) : (
                                                                        <span className="text-xs text-slate-400 italic">建议删减或用客观数据替代</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="glass-panel rounded-3xl p-10 text-center">
                                                <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-3 shadow-glow-emerald">
                                                    <IconCheck size={28} />
                                                </div>
                                                <h4 className="text-base font-bold text-slate-800">未检出任何违禁词</h4>
                                                <p className="text-xs text-slate-400 mt-1">表达得体克制，安心发布即可。</p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* TAB 2: 全篇合规推荐定稿 */}
                                {activeTab === 'rewrite' && (
                                    <div className="glass-panel rounded-3xl p-6 sm:p-8 space-y-6 animate-floatUp">
                                        <div className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-100">
                                            <div>
                                                <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                                                    <IconSparkles className="text-brand-500" size={18} />
                                                    全篇合规推荐参考稿
                                                </h3>
                                                <p className="text-xs text-slate-400 mt-0.5">
                                                    已自动将所有敏感词替换为知性平替词，保持语意通顺自然。
                                                </p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <button
                                                    onClick={handleApplyAllRewrites}
                                                    className="px-3.5 py-2 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-semibold transition"
                                                >
                                                    覆写到上方编辑框
                                                </button>
                                                <button
                                                    onClick={() => handleCopyText(analysis.rewrittenText, '合规定稿')}
                                                    className="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 text-xs font-semibold inline-flex items-center gap-1.5 shadow-sm transition active:scale-95"
                                                >
                                                    <IconCopy size={14} />
                                                    一键复制推荐定稿
                                                </button>
                                            </div>
                                        </div>

                                        <div className="p-6 rounded-2xl bg-white/90 border border-slate-200/80 text-slate-800 text-sm sm:text-base leading-relaxed whitespace-pre-wrap font-sans shadow-sm">
                                            {analysis.rewrittenText}
                                        </div>

                                        {analysis.replacementsApplied.length > 0 && (
                                            <div className="p-4 rounded-2xl bg-slate-50/80 border border-slate-100 space-y-2">
                                                <span className="text-xs font-bold text-slate-500 block">改动关键词对照清单：</span>
                                                <div className="flex flex-wrap gap-2">
                                                    {analysis.replacementsApplied.map((rep, idx) => (
                                                        <div key={idx} className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-white text-xs border border-slate-200 shadow-2xs">
                                                            <span className="line-through text-rose-500 font-medium">{rep.original}</span>
                                                            <IconArrowRight size={12} className="text-slate-400" />
                                                            <span className="text-emerald-700 font-semibold">{rep.replaceWith}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* TAB 3: 爆款排版与生态体检 */}
                                {activeTab === 'content' && (
                                    <div className="glass-panel rounded-3xl p-6 sm:p-8 space-y-6 animate-floatUp">
                                        <div>
                                            <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                                                <IconLayers className="text-brand-500" size={18} />
                                                小红书平台特异性与内容质感诊断
                                            </h3>
                                            <p className="text-xs text-slate-400 mt-0.5">
                                                基于小红书移动端滑屏习惯、算法标签机制与完播互动逻辑综合评估。
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {analysis.contentChecks.map((check, idx) => (
                                                <div
                                                    key={idx}
                                                    className={`p-4 rounded-2xl border flex items-start gap-3.5 transition ${
                                                        check.status === 'good'
                                                            ? 'bg-emerald-50/60 border-emerald-100/90 text-emerald-900'
                                                            : check.status === 'warn'
                                                            ? 'bg-amber-50/60 border-amber-100/90 text-amber-900'
                                                            : 'bg-blue-50/60 border-blue-100/90 text-blue-900'
                                                    }`}
                                                >
                                                    <div className="mt-0.5">
                                                        {check.status === 'good' ? (
                                                            <IconCheck className="text-emerald-600" size={18} />
                                                        ) : check.status === 'warn' ? (
                                                            <IconAlertCircle className="text-amber-600" size={18} />
                                                        ) : (
                                                            <IconSparkles className="text-blue-600" size={18} />
                                                        )}
                                                    </div>
                                                    <div>
                                                        <h4 className="text-xs font-bold mb-1">{check.title}</h4>
                                                        <p className="text-xs opacity-80 leading-relaxed font-normal">{check.desc}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="p-5 rounded-2xl bg-gradient-to-r from-rose-50/80 via-pink-50/60 to-white border border-rose-100">
                                            <h4 className="text-xs font-bold text-rose-900 mb-1.5 flex items-center gap-1.5">
                                                <IconSparkles size={14} className="text-brand-500" />
                                                创作者进阶心法（WenSenLab 策略箴言）
                                            </h4>
                                            <p className="text-xs text-rose-950/70 leading-relaxed font-normal">
                                                “真正有穿透力的小红书文案，从不用‘第一’或‘顶级’自夸，而是用具体的数据事实（客观流）、细腻的生活通感（场景流）和留白克制（格调流）说话。好内容是把读者当成平视的朋友在咖啡馆聊天，而不是站在台阶上拿喇叭喊口号。”
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* 页面底部落款 */}
                    <footer className="text-center mt-14 pt-6 border-t border-slate-200/50 text-slate-400 text-xs space-y-2">
                        <div className="inline-flex items-center gap-2">
                            <span className="font-bold text-slate-700 tracking-wider">WenSenLab_</span>
                            <span className="text-slate-300">©</span>
                            <span className="text-slate-600">文森策</span>
                        </div>
                        <p className="text-[11px] text-slate-400">
                            本工具排雷结果仅供发布前参考，具体审核标准请以小红书官方风控算法及最新广告法监管判定为准。
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
